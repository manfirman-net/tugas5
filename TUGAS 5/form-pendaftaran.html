<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Form Pendaftaran</h2>

    <fieldset>
        <legend>Pendaftaran Siswa</legend>
        <form action="proses.php" method="post" enctype="multipart/form-data">
            <p>
                <label>Nama Lengkap:</label><br>
                <input type="text" placeholder="Masukkan nama lengkap">
            </p>
            <p>
                <label>NIS:</label><br>
                <input type="text" placeholder="Masukkan NIS">
            </p>
            <p>
                <label>Jenis Kelamin:</label><br>
                <input type="radio" name="jk" id="l"> <label for="l">Laki-laki</label>
                <input type="radio" name="jk" id="p"> <label for="p">Perempuan</label>
            </p>
            <p>
                <label>Tanggal Lahir:</label><br>
                <input type="date">
            </p>
            <p>
                <label>Jurusan:</label><br>
                <select>
                    <option>Pilih Jurusan</option>
                    <option>RPL</option>
                    <option>TKJ</option>
                    <option>MM</option>
                </select>
            </p>
            <p>
                <label>Alamat:</label><br>
                <textarea rows="3" cols="30" placeholder="Masukkan alamat lengkap"></textarea>
            </p>
            <p>
                <label>Foto:</label><br>
                <input type="file">
            </p>
            <p>
                <input type="checkbox" id="setuju">
                <label for="setuju">Saya menyetujui data yang saya masukkan</label>
            </p>
            <p>
                <button>
                    <a href="index.html">Send</a>
                </button>
                <input type="reset" value="Reset">
            </p>
        </form>
    </fieldset>
</body>
</html>
